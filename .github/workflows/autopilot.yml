name: Autonomous Tech Radar Autopilot

on:
  schedule:
    # 1. يعمل تلقائياً كل 6 ساعات بالوضع العادي (الرائج + تتبع القفزات + توليد MVP)
    - cron: '0 */6 * * *'
    # 2. يعمل تلقائياً كل يوم جمعة الساعة 18:00 UTC لإصدار التقرير الاستراتيجي الأسبوعي
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'اختر وضع التشغيل (normal = الرائج والقفزات | full = شامل بدون فلترة | weekly = التقرير الأسبوعي)'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - full
          - weekly

permissions:
  contents: write

# منع تداخل دورتين في نفس الوقت (مثلاً عند التقاء الجدول اليومي مع الأسبوعي يوم الجمعة)
concurrency:
  group: radar-autopilot
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: سحب ملفات النظام
        uses: actions/checkout@v4

      - name: إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: التحقق من جاهزية الملفات والأسرار
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f "radar_engine.py" ]; then
            echo "❌ خطأ: ملف radar_engine.py غير موجود في المجلد الرئيسي للمستودع."
            exit 1
          fi
          python -m py_compile radar_engine.py
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ خطأ: مفتاح GEMINI_API_KEY غير مضبوط في Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ تنبيه: مفاتيح تيليجرام غير مكتملة؛ سيتم حفظ التقارير في المستودع دون إرسالها لتيليجرام."
          fi

      - name: ضبط تواريخ التقارير من أسماء ملفاتها
        run: |
          shopt -s nullglob
          for f in reports/report_*.md; do
            ts=$(echo "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}' | tail -n1)
            if [ -n "$ts" ]; then
              d="${ts%%_*}"
              t="${ts##*_}"
              t="${t/-/:}"
              touch -d "$d $t UTC" "$f" || true
            fi
          done
          echo "تمت معالجة تواريخ $(ls reports/report_*.md 2>/dev/null | wc -l) تقرير."

      - name: تحديد الوضع الفعال وتشغيل المحرك
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_SANDBOX: 'true'
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          if [ "$EVENT_SCHEDULE" = "0 18 * * 5" ]; then
            export RADAR_MODE="weekly"
          else
            export RADAR_MODE="${INPUT_MODE:-normal}"
          fi
          echo "RADAR_MODE=$RADAR_MODE" >> "$GITHUB_ENV"
          echo "🚀 الوضع الفعال: $RADAR_MODE | المختبر الحي: مفعّل"
          python radar_engine.py "$RADAR_MODE"

      - name: حفظ الذاكرة والتقارير والأصول البرمجية تلقائياً
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "autopilot@radar.bot"
          git config --local user.name "TechRadar Bot"
          rm -f memory.json.tmp
          mkdir -p reports assets
          if [ -f memory.json ]; then
            git add memory.json
          fi
          git add reports/ assets/

          if git diff --cached --quiet; then
            echo "ℹ️ لا توجد تغييرات جديدة للحفظ."
            {
              echo "## 📡 ملخص تشغيل الرادار"
              echo "- **الوضع:** \`${RADAR_MODE:-normal}\`"
              echo "- **الحالة:** لا توجد مستجدات جديدة في هذه الدورة."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 📡 ملخص تشغيل الرادار"
            echo "- **الوضع:** \`${RADAR_MODE:-normal}\`"
            echo "- **المختبر الحي:** مفعّل (Cloud Sandbox)"
            echo "- **الملفات المحفوظة:**"
            git diff --cached --name-only | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

          LATEST_MD=$(git diff --cached --name-only | grep -E '^reports/(report_|weekly_synthesis_).*\.md$' | tail -n1 || true)
          if [ -n "$LATEST_MD" ] && [ -f "$LATEST_MD" ]; then
            {
              echo ""
              echo "---"
              head -n 35 "$LATEST_MD"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          git commit -m "Auto-update radar [${RADAR_MODE:-normal}]: reports, memory & MVP assets"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ تم حفظ الذاكرة والتقارير والأصول البرمجية بنجاح."
              exit 0
            fi
            echo "⚠️ فشل الدفع (المحاولة $attempt من 3)، جاري المزامنة وإعادة المحاولة..."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              break
            fi
            sleep $((attempt * 3))
          done
          echo "❌ تعذر دفع التغييرات إلى المستودع."
          exit 1

      - name: تنبيه تيليجرام عند فشل التشغيل
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ فشل تشغيل الرادار (الوضع: ${RADAR_MODE:-normal}). تفاصيل التشغيل: ${RUN_URL}" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null || true
          fi
