name: Autonomous Tech Radar

on:
  schedule:
    - cron: '0 0,6,12 * * *'
    - cron: '0 18 * * 0-4,6'
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: Radar mode
        required: true
        default: normal
        type: choice
        options: [normal, full, weekly]

permissions:
  contents: write

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run unit tests
        run: |
          python -m py_compile radar_engine.py radar_engine_fast.py radar/*.py
          python -m unittest discover -s tests -v

  run-radar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select mode and run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_SCHEDULE" = "0 18 * * 5" ]; then
            mode=weekly
          else
            mode="${INPUT_MODE:-normal}"
          fi
          python radar_engine.py "$mode"
      - name: Commit state and reports
        run: |
          git config user.name "TechRadar Bot"
          git config user.email "techradar-bot@users.noreply.github.com"
          git add memory.json reports/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update radar state and reports"
            git push
          fi
